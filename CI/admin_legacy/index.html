<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Career Insight</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Career Insight</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Dashboard</span>
                </a>
                <a href="#users" class="nav-item" data-page="users">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">Users</span>
                    <span class="nav-badge" id="badge-users">5</span>
                </a>
                <a href="#careers" class="nav-item" data-page="careers">
                    <span class="nav-icon">🛣️</span>
                    <span class="nav-label">Career Paths</span>
                </a>
                <a href="#assessments" class="nav-item" data-page="assessments">
                    <span class="nav-icon">📝</span>
                    <span class="nav-label">Assessments</span>
                </a>
                <a href="#jobs" class="nav-item" data-page="jobs">
                    <span class="nav-icon">💼</span>
                    <span class="nav-label">Jobs</span>
                </a>
                <a href="#courses" class="nav-item" data-page="courses">
                    <span class="nav-icon">🎓</span>
                    <span class="nav-label">Courses</span>
                </a>
                <hr class="nav-divider">
                <a href="#notifications" class="nav-item" data-page="notifications">
                    <span class="nav-icon">🔔</span>
                    <span class="nav-label">Notifications</span>
                    <span class="nav-badge" id="badge-notifications">12</span>
                </a>
                <a href="#analytics" class="nav-item" data-page="analytics">
                    <span class="nav-icon">📈</span>
                    <span class="nav-label">Analytics</span>
                </a>
                <a href="#skills" class="nav-item" data-page="skills">
                    <span class="nav-icon">🛠️</span>
                    <span class="nav-label">Skills</span>
                </a>
                <a href="#feedback" class="nav-item" data-page="feedback">
                    <span class="nav-icon">💬</span>
                    <span class="nav-label">Feedback</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logout-btn" class="btn btn-ghost">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 id="page-title">Dashboard</h1>
                </div>
                <div class="topbar-right">
                    <div class="admin-profile">
                        <div class="admin-avatar">A</div>
                        <div class="admin-info">
                            <span class="admin-name">Admin User</span>
                            <span class="admin-role">Super Admin</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Container -->
            <div id="page-container" class="content-padding">
                <!-- Pages will be injected/shown here -->
                
                <!-- Pages -->
                <!-- Dashboard Page -->
                <section id="section-dashboard" class="admin-page active">
                    <div class="welcome-banner card mb-4">
                        <div class="welcome-content">
                            <h2>Welcome back, <span id="admin-name-display">Admin</span>! 👋</h2>
                            <p class="text-muted" id="current-datetime-display"></p>
                        </div>
                    </div>
                    <div id="dashboard-stats-grid" class="grid-stats mb-4">
                        <div class="card stat-card shimmer" style="height:140px;"></div>
                        <div class="card stat-card shimmer" style="height:140px;"></div>
                        <div class="card stat-card shimmer" style="height:140px;"></div>
                        <div class="card stat-card shimmer" style="height:140px;"></div>
                    </div>
                    <div class="section-grid">
                        <div class="card" id="dashboard-chart-card">
                            <div class="shimmer" style="height:250px;"></div>
                        </div>
                        <div class="card" id="dashboard-activity-card">
                            <div class="shimmer" style="height:250px;"></div>
                        </div>
                    </div>
                </section>

                <!-- Users Page -->
                <section id="section-users" class="admin-page" style="display: none;">
                    <div id="users-stats-grid" class="grid-stats mb-4"></div>
                    <div class="card mb-4">
                        <div class="filters mb-4" style="display:flex; gap:12px; justify-content: space-between; flex-wrap: wrap;">
                            <div style="display:flex; gap:12px; flex:1; min-width: 300px;">
                                <input type="text" id="user-search" class="input-field" placeholder="Search by name or email..." style="max-width:300px;">
                                <select id="filter-status" class="input-field" style="max-width:150px;">
                                    <option value="">All Status</option>
                                    <option value="Active">Active</option>
                                    <option value="Blocked">Blocked</option>
                                </select>
                                <select id="filter-role" class="input-field" style="max-width:150px;">
                                    <option value="">All Roles</option>
                                    <option value="user">User</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <button id="export-users-btn" class="btn btn-ghost">Export CSV</button>
                        </div>
                        <div class="table-container">
                            <table class="user-table">
                                <thead>
                                    <tr>
                                        <th><input type="checkbox"></th>
                                        <th>User</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Joined</th>
                                        <th>Last Active</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="users-tbody"></tbody>
                            </table>
                        </div>
                        <div class="pagination mt-4" style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="text-muted pagination-info" id="users-pagination-info"></span>
                            <div style="display:flex; gap:8px;" class="page-buttons" id="users-page-buttons"></div>
                        </div>
                    </div>
                </section>

                <!-- Careers Page -->
                <section id="section-careers" class="admin-page" style="display: none;">
                    <div class="header-actions mb-4" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                        <div style="display:flex; gap:12px; flex:1; min-width:300px;">
                            <input type="text" id="career-search" class="input-field" placeholder="Search career paths..." style="width:250px;">
                            <select id="career-cat-filter" class="input-field" style="width:150px;">
                                <option value="">All Categories</option>
                                <option value="Tech">Technology</option>
                                <option value="Design">Design</option>
                                <option value="Business">Business</option>
                            </select>
                        </div>
                        <button class="btn btn-gradient" onclick="openAddCareerModal()">+ Add New Path</button>
                    </div>
                    <div id="careers-grid" class="section-grid career-grid"></div>
                </section>
                <section id="section-assessments" class="admin-page" style="display: none;"></section>
                <section id="section-jobs" class="admin-page" style="display: none;"></section>
                <section id="section-courses" class="admin-page" style="display: none;"></section>
                <section id="section-notifications" class="admin-page" style="display: none;"></section>
                <section id="section-analytics" class="admin-page" style="display: none;"></section>
                <section id="section-skills" class="admin-page" style="display: none;"></section>
                <section id="section-feedback" class="admin-page" style="display: none;"></section>
            </div>
        </main>
    </div>

    <!-- Side Panel (Shared) -->
    <div id="side-panel" class="side-panel"></div>
    <div id="modal" class="overlay" style="display:flex; align-items:center; justify-content:center;">
        <div class="card" style="width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto;" onclick="event.stopPropagation()">
            <div id="modal-content"></div>
        </div>
    </div>
    <div id="overlay" class="overlay"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
